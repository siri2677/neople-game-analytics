stages:
  - test
  - image
  - release
  - gitops

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  API_IMAGE: "registry.gitlab.com/lime985340/neople-game-analytics-api"
  WEB_IMAGE: "registry.gitlab.com/lime985340/neople-game-analytics-web"
  # Keep these fixed like the Atmo service CI. Override only when the GitOps
  # repository layout is intentionally changed.
  GITOPS_REPO_HOST_PATH: "gitlab.com/lime985340/gitops.git"
  GITOPS_APP_PATH: "workloads/neople-game-analytics"

cache:
  paths:
    - .cache/pip

test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - python -m pytest -q
    - python -m compileall -q src apps

build_images:
  stage: image
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs: ["test"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  before_script:
    - until docker info; do sleep 2; done
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      export IMAGE_TAG="$CI_COMMIT_SHA"
      docker build -f Dockerfile.api -t "$API_IMAGE:$IMAGE_TAG" .
      docker build -f Dockerfile.web -t "$WEB_IMAGE:$IMAGE_TAG" .
      docker push "$API_IMAGE:$IMAGE_TAG"
      docker push "$WEB_IMAGE:$IMAGE_TAG"

promote_release:
  stage: release
  image: docker:27.5.1-cli
  needs: ["test"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - when: never
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      source_tag="$CI_COMMIT_SHA"
      release_tag="$CI_COMMIT_TAG"
      for image in "$API_IMAGE" "$WEB_IMAGE"; do
        docker buildx imagetools inspect "$image:$source_tag" --format '{{.Manifest.Digest}}'
        docker buildx imagetools create --prefer-index=false --tag "$image:$release_tag" "$image:$source_tag"
        source_digest="$(docker buildx imagetools inspect "$image:$source_tag" --format '{{.Manifest.Digest}}')"
        release_digest="$(docker buildx imagetools inspect "$image:$release_tag" --format '{{.Manifest.Digest}}')"
        test "$source_digest" = "$release_digest"
      done

update_gitops_dev:
  stage: gitops
  image: alpine:3.20
  needs: ["build_images"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITOPS_PUSH_TOKEN && $GITOPS_PUSH_TOKEN_USER'
    - when: never
  before_script:
    - apk add --no-cache git
  script:
    - |
      : "${GITOPS_BRANCH:?GITOPS_BRANCH is required (set in the lime Group)}"
      export IMAGE_TAG="$CI_COMMIT_SHA"
      export GITOPS_ENVIRONMENT="dev"
      askpass_file="$(mktemp)"
      cleanup() { rm -f "$askpass_file"; }
      trap cleanup EXIT INT TERM
      cat > "$askpass_file" <<'ASKPASS'
      #!/bin/sh
      case "${1-}" in
        *[Uu]sername*) printf '%s\n' "$GITOPS_PUSH_TOKEN_USER" ;;
        *[Pp]assword*) printf '%s\n' "$GITOPS_PUSH_TOKEN" ;;
        *) exit 1 ;;
      esac
      ASKPASS
      chmod 700 "$askpass_file"
      export GIT_ASKPASS="$askpass_file"
      export GIT_TERMINAL_PROMPT=0
      export LC_ALL=C
      unset GIT_TRACE GIT_TRACE2 GIT_TRACE_CURL GIT_CURL_VERBOSE
      git -c credential.helper= -c http.followRedirects=false clone --branch "$GITOPS_BRANCH" "https://$GITOPS_REPO_HOST_PATH" gitops
      cd gitops
      GITOPS_APP_PATH="$GITOPS_APP_PATH" GITOPS_ENVIRONMENT="$GITOPS_ENVIRONMENT" IMAGE_TAG="$IMAGE_TAG" sh "$CI_PROJECT_DIR/ci/update-gitops-tags.sh"
      git config user.name "gitlab-ci[bot]"
      git config user.email "gitlab-ci[bot]@users.noreply.gitlab.com"
      git add "$GITOPS_APP_PATH/api/environments/$GITOPS_ENVIRONMENT/kustomization.yaml" "$GITOPS_APP_PATH/web/environments/$GITOPS_ENVIRONMENT/kustomization.yaml"
      git commit -m "chore: deploy neople analytics dev $IMAGE_TAG [skip ci]" || true
      git -c credential.helper= -c http.followRedirects=false push origin "HEAD:$GITOPS_BRANCH"

update_gitops_prod:
  stage: gitops
  image: alpine:3.20
  needs: ["promote_release"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $GITOPS_PUSH_TOKEN && $GITOPS_PUSH_TOKEN_USER'
    - when: never
  before_script:
    - apk add --no-cache git
  script:
    - |
      : "${GITOPS_BRANCH:?GITOPS_BRANCH is required (set in the lime Group)}"
      export IMAGE_TAG="$CI_COMMIT_TAG"
      export GITOPS_ENVIRONMENT="prod"
      askpass_file="$(mktemp)"
      cleanup() { rm -f "$askpass_file"; }
      trap cleanup EXIT INT TERM
      cat > "$askpass_file" <<'ASKPASS'
      #!/bin/sh
      case "${1-}" in
        *[Uu]sername*) printf '%s\n' "$GITOPS_PUSH_TOKEN_USER" ;;
        *[Pp]assword*) printf '%s\n' "$GITOPS_PUSH_TOKEN" ;;
        *) exit 1 ;;
      esac
      ASKPASS
      chmod 700 "$askpass_file"
      export GIT_ASKPASS="$askpass_file"
      export GIT_TERMINAL_PROMPT=0
      export LC_ALL=C
      unset GIT_TRACE GIT_TRACE2 GIT_TRACE_CURL GIT_CURL_VERBOSE
      git -c credential.helper= -c http.followRedirects=false clone --branch "$GITOPS_BRANCH" "https://$GITOPS_REPO_HOST_PATH" gitops
      cd gitops
      GITOPS_APP_PATH="$GITOPS_APP_PATH" GITOPS_ENVIRONMENT="$GITOPS_ENVIRONMENT" IMAGE_TAG="$IMAGE_TAG" sh "$CI_PROJECT_DIR/ci/update-gitops-tags.sh"
      git config user.name "gitlab-ci[bot]"
      git config user.email "gitlab-ci[bot]@users.noreply.gitlab.com"
      git add "$GITOPS_APP_PATH/api/environments/$GITOPS_ENVIRONMENT/kustomization.yaml" "$GITOPS_APP_PATH/web/environments/$GITOPS_ENVIRONMENT/kustomization.yaml"
      git commit -m "chore: release neople analytics $IMAGE_TAG [skip ci]" || true
      git -c credential.helper= -c http.followRedirects=false push origin "HEAD:$GITOPS_BRANCH"
